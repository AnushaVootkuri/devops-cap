services:

  postgres:
    image: postgres:18
    container_name: devops-postgres

    env_file:
      - .env

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devopsuser -d devopsdb"]
      interval: 5s
      timeout: 5s
      retries: 10 

  backend:
    build:
      context: ./backend
    container_name: devops-backend

    env_file:
      - .env

    ports:
      - "8000:8000"
    depends_on:
     postgres:
       condition: service_healthy
  
  frontend:
    build:
      context: ./frontend
    container_name: devops-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres-data:
