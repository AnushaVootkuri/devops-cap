name: DevOps Capstone CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
  ECR_BACKEND_REPOSITORY: ${{ vars.ECR_BACKEND_REPOSITORY }}
  ECR_FRONTEND_REPOSITORY: ${{ vars.ECR_FRONTEND_REPOSITORY }}

jobs:

  # ============================================================
  # JOB 1 - TEST APPLICATION
  # ============================================================
  test:
    name: Test Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python compilation
        working-directory: backend
        run: |
          python -m compileall .

      - name: Create .env for Docker Compose
        run: |
          echo "Creating temporary CI environment file..."

          cat > .env <<'EOF'
          POSTGRES_USER=devopsuser
          POSTGRES_PASSWORD=devopspass
          POSTGRES_DB=devopsdb
          EOF

          echo "Validating Docker Compose configuration..."

      - name: Validate Docker Compose
        run:
          docker compose config

          echo "Docker Compose configuration is valid." 

  # ============================================================
  # JOB 2 - BUILD AND PUSH DOCKER IMAGES
  # ============================================================
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4


      # ----------------------------------------------------------
      # AWS AUTHENTICATION
      # ----------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActionsSession
          retry-max-attempts: 2

      # ----------------------------------------------------------
      # GET AWS ACCOUNT ID
      # ----------------------------------------------------------
      - name: Get AWS account ID
        run: |
          echo "AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_ENV"

          echo "AWS Account ID:"
          aws sts get-caller-identity --query Account --output text


      # ----------------------------------------------------------
      # LOGIN TO AMAZON ECR
      # ----------------------------------------------------------
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2


      # ----------------------------------------------------------
      # SET ECR REGISTRY AND IMAGE VARIABLES
      # ----------------------------------------------------------
      - name: Set image variables
        run: |
          ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

          BACKEND_IMAGE="${ECR_REGISTRY}/${ECR_BACKEND_REPOSITORY}"
          FRONTEND_IMAGE="${ECR_REGISTRY}/${ECR_FRONTEND_REPOSITORY}"

          echo "ECR_REGISTRY=${ECR_REGISTRY}" >> "$GITHUB_ENV"
          echo "BACKEND_IMAGE=${BACKEND_IMAGE}" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=${FRONTEND_IMAGE}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${GITHUB_SHA}" >> "$GITHUB_ENV"

          echo "ECR Registry: ${ECR_REGISTRY}"
          echo "Backend Image: ${BACKEND_IMAGE}"
          echo "Frontend Image: ${FRONTEND_IMAGE}"
          echo "Image Tag: ${GITHUB_SHA}"


      # ----------------------------------------------------------
      # BUILD BACKEND IMAGE
      # ----------------------------------------------------------
      - name: Build backend image
        run: |
          docker build \
            -t "${BACKEND_IMAGE}:${IMAGE_TAG}" \
            -t "${BACKEND_IMAGE}:latest" \
            ./backend


      # ----------------------------------------------------------
      # BUILD FRONTEND IMAGE
      # ----------------------------------------------------------
      - name: Build frontend image
        run: |
          docker build \
            -t "${FRONTEND_IMAGE}:${IMAGE_TAG}" \
            -t "${FRONTEND_IMAGE}:latest" \
            ./frontend


      # ----------------------------------------------------------
      # PUSH BACKEND IMAGE
      # ----------------------------------------------------------
      - name: Push backend image
        run: |
          docker push "${BACKEND_IMAGE}:${IMAGE_TAG}"
          docker push "${BACKEND_IMAGE}:latest"


      # ----------------------------------------------------------
      # PUSH FRONTEND IMAGE
      # ----------------------------------------------------------
      - name: Push frontend image
        run: |
          docker push "${FRONTEND_IMAGE}:${IMAGE_TAG}"
          docker push "${FRONTEND_IMAGE}:latest"


      # ----------------------------------------------------------
      # VERIFY ECR IMAGES
      # ----------------------------------------------------------
      - name: Verify ECR images
        run: |
          echo "Backend ECR images:"
          aws ecr describe-images \
            --repository-name "${ECR_BACKEND_REPOSITORY}" \
            --region "${AWS_REGION}" \
            --query 'imageDetails[*].imageTags' \
            --output json

          echo ""
          echo "Frontend ECR images:"
          aws ecr describe-images \
            --repository-name "${ECR_FRONTEND_REPOSITORY}" \
            --region "${AWS_REGION}" \
            --query 'imageDetails[*].imageTags' \
            --output json


  # ============================================================
  # JOB 3 - DEPLOY TO EKS
  # ============================================================
  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest

    needs: build-and-push

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4


      # ----------------------------------------------------------
      # AWS AUTHENTICATION
      # ----------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      # ----------------------------------------------------------
      # GET AWS ACCOUNT ID
      # ----------------------------------------------------------
      - name: Get AWS account ID
        run: |
          echo "AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_ENV"

          echo "AWS Account ID:"
          aws sts get-caller-identity --query Account --output text


      # ----------------------------------------------------------
      # SET ECR IMAGE VARIABLES
      # ----------------------------------------------------------
      - name: Set image variables
        run: |
          ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

          BACKEND_IMAGE="${ECR_REGISTRY}/${ECR_BACKEND_REPOSITORY}"
          FRONTEND_IMAGE="${ECR_REGISTRY}/${ECR_FRONTEND_REPOSITORY}"

          echo "ECR_REGISTRY=${ECR_REGISTRY}" >> "$GITHUB_ENV"
          echo "BACKEND_IMAGE=${BACKEND_IMAGE}" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=${FRONTEND_IMAGE}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${GITHUB_SHA}" >> "$GITHUB_ENV"

          echo "ECR Registry: ${ECR_REGISTRY}"
          echo "Backend Image: ${BACKEND_IMAGE}"
          echo "Frontend Image: ${FRONTEND_IMAGE}"
          echo "Image Tag: ${GITHUB_SHA}"


      # ----------------------------------------------------------
      # CONFIGURE KUBECTL
      # ----------------------------------------------------------
      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region "${AWS_REGION}" \
            --name "${EKS_CLUSTER_NAME}"

          kubectl cluster-info


      # ----------------------------------------------------------
      # VERIFY NAMESPACE
      # ----------------------------------------------------------
      - name: Verify Kubernetes namespace
        run: |
          kubectl get namespace devops-capstone


      # ----------------------------------------------------------
      # APPLY BACKEND MANIFEST
      # ----------------------------------------------------------
      - name: Apply backend manifest
        run: |
          kubectl apply \
            -f k8s/backend.yaml \
            -n devops-capstone


      # ----------------------------------------------------------
      # DEPLOY BACKEND IMAGE
      # ----------------------------------------------------------
      - name: Deploy backend image
        run: |
          kubectl set image deployment/backend \
            backend="${BACKEND_IMAGE}:${IMAGE_TAG}" \
            -n devops-capstone


      # ----------------------------------------------------------
      # APPLY FRONTEND MANIFEST
      # ----------------------------------------------------------
      - name: Apply frontend manifest
        run: |
          kubectl apply \
            -f k8s/frontend.yaml \
            -n devops-capstone


      # ----------------------------------------------------------
      # DEPLOY FRONTEND IMAGE
      # ----------------------------------------------------------
      - name: Deploy frontend image
        run: |
          kubectl set image deployment/frontend \
            frontend="${FRONTEND_IMAGE}:${IMAGE_TAG}" \
            -n devops-capstone


      # ----------------------------------------------------------
      # APPLY SERVICES
      # ----------------------------------------------------------
      - name: Apply Kubernetes services
        run: |
          kubectl apply \
            -f k8s/services.yaml \
            -n devops-capstone


      # ----------------------------------------------------------
      # WAIT FOR BACKEND ROLLOUT
      # ----------------------------------------------------------
      - name: Wait for backend rollout
        run: |
          kubectl rollout status deployment/backend \
            -n devops-capstone \
            --timeout=180s


      # ----------------------------------------------------------
      # WAIT FOR FRONTEND ROLLOUT
      # ----------------------------------------------------------
      - name: Wait for frontend rollout
        run: |
          kubectl rollout status deployment/frontend \
            -n devops-capstone \
            --timeout=180s


      # ----------------------------------------------------------
      # FINAL DEPLOYMENT VERIFICATION
      # ----------------------------------------------------------
      - name: Verify Kubernetes deployment
        run: |
          echo "========================================"
          echo "DEPLOYMENTS"
          echo "========================================"

          kubectl get deployments \
            -n devops-capstone

          echo ""
          echo "========================================"
          echo "PODS"
          echo "========================================"

          kubectl get pods \
            -n devops-capstone \
            -o wide

          echo ""
          echo "========================================"
          echo "SERVICES"
          echo "========================================"

          kubectl get services \
            -n devops-capstone

          echo ""
          echo "========================================"
          echo "INGRESS"
          echo "========================================"

          kubectl get ingress \
            -n devops-capstone
