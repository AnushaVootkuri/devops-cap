name: DevOps Capstone CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  test-backend:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Check Python syntax
        run: |
          python -m py_compile backend/main.py


  build-and-push:

    runs-on: ubuntu-latest

    needs: test-backend

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/devops-backend:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/devops-backend:latest


      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/devops-frontend:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/devops-frontend:latest