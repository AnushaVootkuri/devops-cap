name: DevOps Capstone CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  test-backend:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Check Python syntax
        run: |
          python -m py_compile backend/main.py


  build-and-push:

    runs-on: ubuntu-latest

    needs: test-backend

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      - name: Build backend Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/devops-backend:${{ github.sha }} \
            ./backend
      - name: Push backend image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/devops-backend:${{ github.sha }}


      - name: Build frontend Docker image
        run: |
          docker build \
            -t {{ secrets.DOCKERHUB_USERNAME }}/devops-frontend:${{ github.sha }} \
            ./frontend

      - name: Push frontend image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/devops-frontend:${{ github.sha }}
      