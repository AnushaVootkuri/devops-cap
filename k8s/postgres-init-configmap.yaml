apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: devops-capstone
data:
  init.sql: |
    CREATE TABLE IF NOT EXISTS products (
        id SERIAL PRIMARY KEY,
        name VARCHAR(100) NOT NULL,
        price NUMERIC(10,2) NOT NULL
    );

    INSERT INTO products (name, price) VALUES
    ('Laptop', 1200.00),
    ('Keyboard', 75.00),
    ('Mouse', 35.00),
    ('Monitor', 300.00);