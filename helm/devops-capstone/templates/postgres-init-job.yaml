apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-init
  namespace: {{ .Values.namespace }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 5
  template:
    metadata:
      labels:
        app: postgres-init
    spec:
      restartPolicy: OnFailure

      containers:
        - name: postgres-init
          image: postgres:16

          env:
            - name: PGHOST
              value: "postgres"

            - name: PGPORT
              value: "5432"

            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_DB

            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER

            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD

          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for PostgreSQL..."
              until pg_isready; do
                sleep 2
              done

              echo "PostgreSQL is ready."
              echo "Running database initialization..."
              psql -f /sql/init.sql

              echo "Database initialization completed."

          volumeMounts:
            - name: init-sql
              mountPath: /sql

      volumes:
        - name: init-sql
          configMap:
            name: postgres-init